name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tests (PostgreSQL via testcontainers)
        env:
          # Ephemeral runner: Ryuk adds nothing and can be flaky.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest

  docker:
    name: Build image and validate compose files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose files
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          API_DOMAIN: api.example.com
          ACME_EMAIL: ops@example.com
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Build image
        run: docker build -f docker/Dockerfile -t notes-api:ci .
