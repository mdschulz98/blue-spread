name: CI

# Runs on PRs (every push to a PR branch) and after merges to main. Feature branches without
# a PR don't run CI automatically: use "Run workflow" (workflow_dispatch) or `uv run poe check`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tests (PostgreSQL via testcontainers)
        env:
          # Ephemeral runner: Ryuk adds nothing and can be flaky.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest

  docker:
    name: Docker build and stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # .env.example has every variable compose needs (incl. API_DOMAIN/ACME_EMAIL for the
      # prod file); init_env copies it and generates JWT_SECRET/POSTGRES_PASSWORD.
      - name: Create .env
        run: python3 -c "from tools.dev import init_env; init_env()"

      - name: Validate compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      # The base stack only (no dev override): the production image and start command,
      # routed by Traefik over plain HTTP.
      - name: Build and start stack
        run: docker compose -f compose.yaml up -d --build --wait --wait-timeout 180

      - name: Check migrations ran
        run: |
          code=$(docker compose -f compose.yaml ps -a migrate --format '{{.ExitCode}}')
          echo "migrate exit code: $code"
          test "$code" = "0"

      - name: Smoke test through Traefik
        run: python3 tools/smoke.py

      - name: Show stack state and logs
        if: failure()
        run: |
          docker compose -f compose.yaml ps -a
          docker compose -f compose.yaml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml down -v
